<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Konkurs Mini App</title>
<style>
:root{--bg:#f2f4ff;--card:#fff;--tx:#1b1e3a;--mut:#7a7f9e;--p:#6c5ce7;--p2:#00cec9;--ok:#00b894;--err:#ff5d6c;--bd:#e5e8fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1024;--card:#1a1c3a;--tx:#f1f2ff;--mut:#9094b8;--bd:#2a2d55}}
:root[data-theme="dark"]{--bg:#0f1024;--card:#1a1c3a;--tx:#f1f2ff;--mut:#9094b8;--bd:#2a2d55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;animation:float 12s ease-in-out infinite}
.b1{width:260px;height:260px;background:var(--p);top:-60px;left:-60px}
.b2{width:240px;height:240px;background:var(--p2);bottom:60px;right:-70px;animation-delay:-5s}
@keyframes float{50%{transform:translate(40px,60px) scale(1.2)}}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px 14px 96px}
header{display:flex;align-items:center;gap:12px;padding:10px 4px;animation:down .6s both}
.av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;overflow:hidden;box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--p);animation:pulse 3s infinite}
.av img{width:100%;height:100%;object-fit:cover}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--card),0 0 0 8px rgba(108,92,231,.35)}}
header b{display:block;font-size:17px}header small{color:var(--mut)}
.view{animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
@keyframes down{from{opacity:0;transform:translateY(-20px)}}
.hero{background:linear-gradient(135deg,var(--p),#a29bfe 55%,var(--p2));background-size:200% 200%;animation:grad 8s ease infinite;color:#fff;border-radius:24px;padding:22px;margin:8px 0 16px;position:relative;overflow:hidden}
.hero:after{content:"🎁";position:absolute;right:14px;top:6px;font-size:84px;opacity:.25;animation:wob 4s ease-in-out infinite}
@keyframes grad{50%{background-position:100% 50%}}
@keyframes wob{50%{transform:rotate(14deg) scale(1.1)}}
.hero h2{margin:0 0 6px;font-size:22px}.hero p{margin:0;opacity:.9;font-size:14px}
.stats{display:flex;gap:10px;margin-top:16px}.stats div{flex:1;background:rgba(255,255,255,.2);border-radius:14px;padding:10px;text-align:center}.stats b{font-size:20px;display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;animation:up .5s both;transition:transform .2s,box-shadow .2s}
.card.tap:active{transform:scale(.97)}
.card.tap:hover{box-shadow:0 10px 30px rgba(108,92,231,.18)}
h3{margin:4px 0 12px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.mut{color:var(--mut);font-size:13px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:rgba(108,92,231,.14);color:var(--p);font-size:12px;font-weight:600}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p),#8e7dff);cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,opacity .2s;box-shadow:0 8px 20px rgba(108,92,231,.35)}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.5}
.btn.ok{background:linear-gradient(135deg,var(--ok),#55efc4)}
.btn.ghost{background:transparent;color:var(--p);border:2px dashed var(--p);box-shadow:none}
.btn:not(:disabled):after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:rgba(255,255,255,.35);transform:skewX(-20deg);animation:shine 3s infinite}
@keyframes shine{to{left:130%}}
input,textarea{width:100%;background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding:13px;color:var(--tx);font:inherit;margin-bottom:10px;outline:0;transition:border .2s}
input:focus,textarea:focus{border-color:var(--p)}
label{font-size:13px;font-weight:600;color:var(--mut);display:block;margin:4px 0 6px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:492px;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 0;border-radius:18px;font-size:11px;font-weight:600;cursor:pointer;transition:all .3s}
nav button span{display:block;font-size:20px;transition:transform .3s}
nav button.on{background:linear-gradient(135deg,var(--p),#8e7dff);color:#fff}nav button.on span{transform:translateY(-2px) scale(1.2)}
.ch{display:flex;align-items:center;gap:12px}
.ci{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(0,206,201,.15)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:14px;color:#fff;transition:all .3s}
.chk.on{background:var(--ok);border-color:var(--ok);animation:pop .4s}
@keyframes pop{50%{transform:scale(1.5)}}
.sel{border-color:var(--p)!important;background:rgba(108,92,231,.08)}
.steps{display:flex;gap:6px;margin:6px 0 16px}.steps i{flex:1;height:6px;border-radius:9px;background:var(--bd);transition:background .4s}.steps i.on{background:linear-gradient(90deg,var(--p),var(--p2))}
.big{font-size:44px;font-weight:800;text-align:center;background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.act{display:flex;gap:10px;margin:12px 0}.act button{flex:1;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:11px;font-weight:700;cursor:pointer;font-size:15px}
.act button.liked{border-color:var(--err);color:var(--err)}.liked .h{display:inline-block;animation:pop .5s}
.cm{padding:10px 12px;background:var(--bg);border-radius:14px;margin-bottom:8px;animation:up .4s both;font-size:14px}.cm b{color:var(--p)}
.post{background:#182533;color:#fff;border-radius:18px;padding:14px;margin:10px 0}.post .pb{background:#2b5278;text-align:center;padding:10px;border-radius:10px;margin-top:10px;font-weight:700}
.link{background:var(--bg);border:2px dashed var(--p);border-radius:12px;padding:10px;font-size:13px;word-break:break-all;margin:10px 0}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;z-index:20;font-weight:600;font-size:14px;animation:down .4s both}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:30;animation:fall 2.2s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.spin{display:inline-block;width:16px;height:16px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-3px}@keyframes rot{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}.empty div{font-size:48px;animation:wob 3s infinite}
.hide{display:none}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div id="app"></div>
<nav><div id="nav"></div></nav>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
const TU=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{first_name:"Aziz",username:"aziz_uz",photo_url:""};
const POOL=[{id:1,name:"Texno Yangiliklar",user:"@texno_yangilik",type:"Kanal",ic:"📢"},{id:2,name:"Toshkent Chat",user:"@toshkent_chat",type:"Guruh",ic:"👥"},{id:3,name:"Sovgʻa Bot",user:"@sovga_uz_bot",type:"Bot",ic:"🤖"},{id:4,name:"Kino Olami",user:"@kino_olami",type:"Kanal",ic:"📢"}];
let S={tab:"home",chs:[],cons:[{id:101,title:"iPhone 16 Pro yutib oling!",desc:"Oddiy shartlar: kanallarga obuna boʻling va qatnashing. Gʻolib tasodifiy tanlanadi.",prize:"iPhone 16 Pro",tasks:[1,3],end:"2026-12-01",parts:1284,likes:342,liked:false,joined:false,subs:{},comments:[{n:"Dilnoza",t:"Omad hammaga! 🍀"},{n:"Jasur",t:"Ajoyib konkurs 🔥"}]}],open:null,w:{step:1,sel:[],title:"",desc:"",prize:"",end:""},made:null};
try{const x=localStorage.getItem("kms");if(x)S=Object.assign(S,JSON.parse(x),{tab:"home",open:null,made:null})}catch(e){}
const save=()=>{try{localStorage.setItem("kms",JSON.stringify({chs:S.chs,cons:S.cons}))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const allCh=()=>POOL;
const chById=id=>POOL.find(c=>c.id==id)||{name:"Kanal",user:"@kanal",ic:"📢"};
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function confetti(){const c=["#6c5ce7","#00cec9","#fdcb6e","#ff7675","#55efc4"];for(let i=0;i<70;i++){const d=document.createElement("i");d.className="cf";d.style.left=Math.random()*100+"vw";d.style.background=c[i%5];d.style.animationDelay=Math.random()*.6+"s";d.style.borderRadius=i%2?"50%":"2px";document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function count(el,to){let n=0;const st=Math.max(1,Math.ceil(to/40));const t=setInterval(()=>{n=Math.min(to,n+st);el.textContent=n.toLocaleString("en-US").replace(/,/g," ");if(n>=to)clearInterval(t)},25)}
function go(t){S.tab=t;S.open=null;S.made=null;render()}
function head(){const a=TU.photo_url?`<img src="${esc(TU.photo_url)}" alt="">`:esc((TU.first_name||"U")[0]);return `<header><div class="av">${a}</div><div><b>${esc(TU.first_name||"")}</b><small>@${esc(TU.username||"username")} · roʻyxatdan oʻtgan ✓</small></div></header>`}
function render(){
 $("nav").innerHTML=[["home","🏠","Konkurslar"],["new","✨","Yaratish"],["chs","📡","Kanallarim"]].map(([k,i,n])=>`<button class="${S.tab==k?"on":""}" onclick="go('${k}')"><span>${i}</span>${n}</button>`).join("");
 let h=head();
 if(S.open)h+=detail();else if(S.made)h+=made();else if(S.tab=="home")h+=home();else if(S.tab=="new")h+=wiz();else h+=chsView();
 $("app").innerHTML=`<div class="view">${h}</div>`;
 document.querySelectorAll("[data-n]").forEach(e=>count(e,+e.dataset.n));
 window.scrollTo(0,0);
}
function home(){
 const tp=S.cons.reduce((a,c)=>a+c.parts,0);
 let h=`<div class="hero"><h2>Konkurs yarating 🎉</h2><p>Kanalingiz obunachilarini oshiring va sovgʻalar tarqating.</p><div class="stats"><div><b data-n="${S.cons.length}">0</b>konkurs</div><div><b data-n="${tp}">0</b>ishtirokchi</div></div></div><h3>Faol konkurslar</h3>`;
 S.cons.forEach((c,i)=>{h+=`<div class="card tap" style="animation-delay:${i*.08}s" onclick="openC(${c.id})"><div class="row"><b class="sp">${esc(c.title)}</b>${c.joined?'<span class="pill">Qatnashyapsiz ✓</span>':""}</div><div class="mut" style="margin:6px 0">🏆 ${esc(c.prize)} · ⏰ ${esc(c.end)}</div><div class="row mut"><span>👥 ${c.parts.toLocaleString("en-US").replace(/,/g," ")}</span><span>❤️ ${c.likes}</span><span>💬 ${c.comments.length}</span></div></div>`});
 return h+`<button class="btn" onclick="go('new')">✨ Yangi konkurs yaratish</button>`}
function chsView(){
 let h=`<h3>Kanal, guruh va botlarim</h3><div class="card"><div class="mut">1. Botni kanal/guruhingizga <b>admin</b> qiling.<br>2. Pastdagi tugmani bosing — bot admin boʻlgan joylar chiqadi.</div></div>`;
 if(!S.chs.length)h+=`<div class="empty"><div>📡</div>Hali hech narsa ulanmagan</div>`;
 S.chs.forEach((id,i)=>{const c=chById(id);h+=`<div class="card ch" style="animation-delay:${i*.08}s"><div class="ci">${c.ic}</div><div class="sp"><b>${esc(c.name)}</b><div class="mut">${esc(c.user)} · ${c.type}</div></div><span class="pill">Admin ✓</span></div>`});
 return h+`<button class="btn" id="addb" onclick="addCh()">➕ Bot admin qilingan joylarni qidirish</button>`}
function addCh(){const b=$("addb");b.innerHTML='<span class="spin"></span> Qidirilmoqda...';b.disabled=true;setTimeout(()=>{const n=POOL.find(c=>!S.chs.includes(c.id));if(n){S.chs.push(n.id);save();toast("✅ "+n.name+" ulandi")}else toast("Yangi joy topilmadi");render()},1300)}
function wiz(){
 const w=S.w;let h=`<div class="steps">${[1,2,3].map(i=>`<i class="${w.step>=i?"on":""}"></i>`).join("")}</div>`;
 if(w.step==1){
  h+=`<h3>1. Topshiriq kanallarini tanlang</h3>`;
  if(!S.chs.length)return h+`<div class="empty"><div>🤖</div>Avval botni admin qiling va ulang</div><button class="btn" onclick="go('chs')">📡 Kanal ulash</button>`;
  S.chs.forEach(id=>{const c=chById(id);h+=`<div class="card ch tap ${w.sel.includes(id)?"sel":""}" onclick="tog(${id})"><div class="ci">${c.ic}</div><div class="sp"><b>${esc(c.name)}</b><div class="mut">${esc(c.user)} · ${c.type}</div></div><div class="chk ${w.sel.includes(id)?"on":""}">✓</div></div>`});
  h+=`<p class="mut">Tanlangan: ${w.sel.length} ta obuna topshiriq</p><button class="btn" onclick="nxt(2)">Davom etish →</button>`;
 }else if(w.step==2){
  h+=`<h3>2. Konkurs maʼlumotlari</h3><label>Nomi</label><input id="t" value="${esc(w.title)}" placeholder="Masalan: iPhone yutib oling"><label>Tavsif</label><textarea id="d" rows="3" placeholder="Shartlar...">${esc(w.desc)}</textarea><label>Yutuq 🏆</label><input id="p" value="${esc(w.prize)}" placeholder="Masalan: 500 000 soʻm"><label>Tugash sanasi</label><input id="e" type="date" value="${esc(w.end)}"><button class="btn" onclick="nxt(3)">Davom etish →</button>`;
 }else{
  h+=`<h3>3. Tekshiring va yarating</h3><div class="card"><b>${esc(w.title)}</b><p class="mut">${esc(w.desc)}</p><div>🏆 ${esc(w.prize)}</div><div class="mut">⏰ ${esc(w.end)}</div><hr style="border:0;border-top:1px solid var(--bd)">${w.sel.map(id=>`<div class="mut">📌 ${esc(chById(id).name)} ${esc(chById(id).user)}</div>`).join("")}</div><button class="btn ok" onclick="mk()">🚀 Konkursni yaratish</button>`;
 }
 return h}
function tog(id){const s=S.w.sel;s.includes(id)?s.splice(s.indexOf(id),1):s.push(id);render()}
function nxt(n){const w=S.w;
 if(w.step==1&&!w.sel.length)return toast("Kamida 1 ta kanal tanlang");
 if(w.step==2){w.title=$("t").value.trim();w.desc=$("d").value.trim();w.prize=$("p").value.trim();w.end=$("e").value;if(!w.title||!w.prize){const x=$("t");x.classList.add("shake");return toast("Nom va yutuqni kiriting")}}
 w.step=n;render()}
function mk(){const w=S.w;const c={id:Date.now()%100000,title:w.title,desc:w.desc||"Shartlarni bajaring va qatnashing!",prize:w.prize,tasks:[...w.sel],end:w.end||"—",parts:0,likes:0,liked:false,joined:false,subs:{},comments:[]};S.cons.unshift(c);S.w={step:1,sel:[],title:"",desc:"",prize:"",end:""};S.made=c;save();confetti();render()}
function made(){const c=S.made;const l=`https://t.me/konkurs_bot/app?startapp=c${c.id}`;
 return `<div class="big">🎉</div><h3 style="text-align:center">Konkurs yaratildi!</h3><div class="card"><b>Ulashish havolasi</b><div class="link">${l}</div><button class="btn" onclick="cp('${l}')">📋 Havolani nusxalash</button></div><div class="mut">Kanalingizdagi post koʻrinishi:</div><div class="post"><b>🎁 ${esc(c.title)}</b><p style="opacity:.85">${esc(c.desc)}</p>🏆 ${esc(c.prize)}<div class="pb">🎯 Konkursga qatnashish</div></div><button class="btn ghost" onclick="openC(${c.id})">Konkursni ochish</button>`}
function cp(t){try{navigator.clipboard.writeText(t)}catch(e){}toast("✅ Nusxalandi")}
function openC(id){S.open=S.cons.find(c=>c.id==id);render()}
function detail(){const c=S.open;
 let h=`<button class="act" style="all:unset;color:var(--p);font-weight:700;cursor:pointer" onclick="S.open=null;render()">← Orqaga</button><div class="hero"><h2>${esc(c.title)}</h2><p>${esc(c.desc)}</p></div><div class="card"><div class="big" data-n="${c.parts}">0</div><div class="mut" style="text-align:center">ishtirokchi qatnashmoqda</div><div class="row" style="margin-top:10px"><span class="pill">🏆 ${esc(c.prize)}</span><span class="pill">⏰ ${esc(c.end)}</span></div></div><h3>Topshiriqlar</h3>`;
 c.tasks.forEach((id,i)=>{const k=chById(id),ok=c.subs[id];h+=`<div class="card ch" id="tk${id}" style="animation-delay:${i*.08}s"><div class="ci">${k.ic}</div><div class="sp"><b>${esc(k.name)}</b><div class="mut">${esc(k.user)}</div></div>${c.joined?`<div class="chk on">✓</div>`:`<button class="pill" style="border:0;cursor:pointer" onclick="sub(${id})">${ok?"Obuna ✓":"Obuna boʻlish"}</button>`}</div>`});
 h+=c.joined?`<button class="btn ok" disabled>✅ Siz qatnashyapsiz</button>`:`<button class="btn" id="jb" onclick="join()">🎯 Qatnashish (obunani tekshirish)</button>`;
 h+=`<div class="act"><button class="${c.liked?"liked":""}" onclick="lk()"><span class="h">${c.liked?"❤️":"🤍"}</span> ${c.likes}</button><button onclick="$('ci').focus()">💬 ${c.comments.length}</button></div><h3>Fikrlar</h3><div class="row"><input id="ci" placeholder="Fikringizni yozing..." style="margin:0"><button class="btn" style="width:56px;padding:13px" onclick="cm()">➤</button></div><div style="margin-top:12px">${c.comments.map(m=>`<div class="cm"><b>${esc(m.n)}</b><br>${esc(m.t)}</div>`).join("")}</div>`;
 return h}
function sub(id){const c=S.open;c.subs[id]=true;try{if(tg)tg.openTelegramLink("https://t.me/"+chById(id).user.slice(1))}catch(e){}save();toast("Obuna belgilandi ✓");render()}
function join(){const c=S.open,b=$("jb");b.innerHTML='<span class="spin"></span> Tekshirilmoqda...';b.disabled=true;
 setTimeout(()=>{const miss=c.tasks.filter(id=>!c.subs[id]);if(miss.length){miss.forEach(id=>{const e=$("tk"+id);e.classList.add("shake");e.style.borderColor="var(--err)"});b.disabled=false;b.innerHTML="🎯 Qatnashish (obunani tekshirish)";toast("❌ "+miss.length+" ta kanalga obuna boʻlmadingiz")}
 else{c.joined=true;c.parts++;save();confetti();toast("🎉 Siz konkursda qatnashyapsiz!");render()}},1200)}
function lk(){const c=S.open;c.liked=!c.liked;c.likes+=c.liked?1:-1;save();render()}
function cm(){const v=$("ci").value.trim();if(!v)return;S.open.comments.unshift({n:TU.first_name||"Siz",t:v});save();render()}
render();
</script>
</body>
</html>
